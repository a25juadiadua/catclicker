<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatCLicker 2</title>
</head>
<body>


    <ul id="llista"></ul>
    <img id="imgGat" src="" alt="">
    <h3 id="nomActual"></h3>
    <h3 id="contActual"></h3>

</body>

<script>

    let data = {
        catActive: 0,
        gatos: [
            { name: "Michifu",  image: "img/cat.jpg", nclicks: 0 },
            { name: "Minino",  image: "img/cat2.jpg", nclicks: 0 },
            { name: "Garfield",  image: "img/cat3.jpg", nclicks: 0 },
            { name: "LindoGatito", image: "img/cat4.jpeg", nclicks: 0 }
        ]
    };

    function mostrarGat(id){

        data.catActive = id;
        
        document.getElementById("imgGat").src=data.gatos[id].image;
        document.getElementById("nomActual").innerHTML = data.gatos[id].name;
        document.getElementById("contActual").innerHTML = data.gatos[id].nclicks;
    }

    let htmlStr = "";

    data.gatos.forEach((element,index) => {
        
        htmlStr += `<li id = "${index}">${element.name}</li>`;
    });

    document.getElementById("llista").innerHTML = htmlStr;

    document.getElementById("llista").addEventListener("click", function (e){
        console.log("has apretat al gat en la llista" + e.target.id)
        mostrarGat(e.target.id)
    })


    document.getElementById("imgGat").addEventListener("click",function(){
        data.gatos[data.catActive].nclicks++;
    
        document.getElementById("contActual").innerHTML=data.gatos[data.catActive].nclicks;
    })

</script>
</html>
